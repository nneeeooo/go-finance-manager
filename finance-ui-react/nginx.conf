# Template: the nginx image renders it to /etc/nginx/conf.d/default.conf at start and fills
# ${NGINX_LOCAL_RESOLVERS} from /etc/resolv.conf (the podman network's DNS), see Containerfile.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Re-resolve finance-api every 10 s: after an API restart it has a new IP on the podman network, and a
    # name resolved once at startup would keep pointing at the old one (502 Host is unreachable)
    resolver ${NGINX_LOCAL_RESOLVERS} valid=10s ipv6=off;
    set $api http://finance-api:8080;

    # Behind Cloudflare: plain http would break login (the Secure login cookie is dropped over http)
    if ($http_x_forwarded_proto = "http") {
        return 301 https://$host$request_uri;
    }

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;

    # SSO routes (login, callback, logout, me) of the Go backend
    location /auth/ {
        proxy_pass $api;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy API requests to Go backend
    location /api/ {
        proxy_pass $api;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # React SPA routing fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Static assets caching
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
