[tasks.api]
dir = "finance-api"
run = "go run ./cmd/api"

[tasks.ui]
dir = "finance-ui-react"
run = "npm run dev"

[tasks.auth]
description = "local SSO (../nneeeooo-auth, DB auth_dev on the .env Postgres)"
run = "node scripts/auth-dev.mjs"

[tasks.dev]
description = "auth :8090 + API :8080 + UI :5173"
depends = ["auth", "api", "ui"]
