basePath: /api/v1
definitions:
  account_dto.CreateAccountRequest:
    properties:
      bank:
        allOf:
        - $ref: '#/definitions/models.Bank'
        enum:
        - 1
        - 2
      currency:
        type: integer
      monobank_account_id:
        type: string
      name:
        type: string
      user_id:
        type: string
    required:
    - currency
    - name
    - user_id
    type: object
  account_dto.CreateAccountResponse:
    properties:
      id:
        type: string
    type: object
  account_dto.GetAccountResponse:
    properties:
      bank:
        $ref: '#/definitions/models.Bank'
      currency:
        type: integer
      id:
        type: string
      monobank_account_id:
        type: string
      name:
        type: string
      userId:
        type: string
    type: object
  models.Bank:
    enum:
    - 1
    - 2
    format: int32
    type: integer
    x-enum-varnames:
    - BankMonobank
    - BankPrivatBank
  transaction_dto.CreateTransactionRequest:
    properties:
      account_id:
        type: string
      amount:
        type: integer
      currency:
        type: integer
      description:
        type: string
      id:
        type: string
      mcc:
        type: integer
      occurred_at:
        type: string
    required:
    - account_id
    - amount
    - currency
    - description
    - id
    - mcc
    - occurred_at
    type: object
  transaction_dto.CreateTransactionResponse:
    properties:
      id:
        type: string
    type: object
  transaction_dto.TransactionResponse:
    properties:
      account_id:
        type: string
      amount:
        type: integer
      currency:
        type: integer
      description:
        type: string
      id:
        type: string
      mcc:
        type: integer
      occurred_at:
        type: string
    required:
    - account_id
    - amount
    - currency
    - description
    - id
    - mcc
    - occurred_at
    type: object
  user_dto.CreateUserRequest:
    properties:
      email:
        maxLength: 320
        type: string
      password:
        maxLength: 128
        minLength: 8
        type: string
    required:
    - email
    - password
    type: object
  user_dto.CreateUserResponse:
    properties:
      email:
        type: string
      id:
        type: string
    type: object
host: localhost:8080
info:
  contact: {}
  description: API for managing personal finances.
  title: Finance API
  version: "1.0"
paths:
  /accounts:
    post:
      consumes:
      - application/json
      description: Creates a new bank account for a user.
      parameters:
      - description: Account data
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/account_dto.CreateAccountRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/account_dto.CreateAccountResponse'
        "400":
          description: Invalid request body or input
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Failed to create account
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Create an account
      tags:
      - accounts
  /accounts/{account_id}:
    get:
      description: Returns an account by ID.
      parameters:
      - description: Account UUID
        in: path
        name: account_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/account_dto.GetAccountResponse'
        "400":
          description: Invalid account ID
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Account not found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Failed to get account
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get account
      tags:
      - accounts
  /accounts/{id}:
    delete:
      description: Deletes an account by its ID.
      parameters:
      - description: Account ID
        in: path
        name: id
        required: true
        type: string
      responses:
        "204":
          description: No Content
        "400":
          description: Invalid account ID
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Account not found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Failed to delete account
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Delete account
      tags:
      - accounts
  /accounts/{id}/transactions:
    get:
      description: Returns all transactions belonging to an account.
      parameters:
      - description: Account ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/transaction_dto.TransactionResponse'
            type: array
        "400":
          description: Invalid account ID
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Failed to fetch transactions
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get account transactions
      tags:
      - transactions
  /transactions:
    post:
      consumes:
      - application/json
      description: Creates a new transaction for an account.
      parameters:
      - description: Transaction data
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/transaction_dto.CreateTransactionRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/transaction_dto.CreateTransactionResponse'
        "400":
          description: Invalid request body or input
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Failed to create transaction
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Create a transaction
      tags:
      - transactions
  /transactions/{id}:
    delete:
      description: Deletes a transaction by its ID.
      parameters:
      - description: Transaction ID
        in: path
        name: id
        required: true
        type: string
      responses:
        "204":
          description: No Content
        "400":
          description: Invalid transaction ID
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Transaction not found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Failed to delete transaction
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Delete transaction
      tags:
      - transactions
  /users:
    post:
      consumes:
      - application/json
      description: Creates a new user.
      parameters:
      - description: User data
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/user_dto.CreateUserRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: Conflict
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Create user
      tags:
      - users
  /users/{id}:
    delete:
      description: Deletes a user by their ID.
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Delete user
      tags:
      - users
    get:
      description: Returns a user by their ID.
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/user_dto.CreateUserResponse'
        "400":
          description: Invalid user ID
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: User not found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Failed to fetch user
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get user
      tags:
      - users
  /users/{id}/accounts:
    get:
      description: Returns all accounts belonging to a user.
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/account_dto.GetAccountResponse'
            type: array
        "400":
          description: Invalid user ID
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Failed to fetch accounts
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get user accounts
      tags:
      - accounts
  /users/{id}/transactions:
    get:
      description: Returns all transactions belonging to accounts owned by the specified
        user, ordered by occurrence time descending.
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/transaction_dto.TransactionResponse'
            type: array
        "400":
          description: Invalid user ID
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Failed to fetch transactions
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get user transactions
      tags:
      - transactions
swagger: "2.0"
